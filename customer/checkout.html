<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Glow.Cosmetic</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">

</head>

<body>

   <header class="navbar">
        <a href="home.html" class="logo">
            <img src="../img/logo.jpeg" alt="Glow.Cosmetic">
        </a>

        <nav class="desktop-menu">

            <a href="home.html">
                Home
            </a>

            <a href="produk.html">
                Produk
            </a>

            <a href="blog.html">
                Blog
            </a>

            <a href="faq.html">
                FAQ
            </a>

        </nav>

        <div class="desktop-actions">
            <a href="akun.html#wishlist" class="nav-icon wishlist-nav-icon" aria-label="Wishlist">
                <i class="fa-regular fa-heart"></i>
                <span class="wishlist-count" id="wishlist-count">0</span>
            </a>

            <!-- Account -->
            <a href="login.html" class="nav-icon" aria-label="Akun">
                <i class="fa-regular fa-user"></i>
            </a>

            <!-- Cart -->
            <a href="keranjang.html" class="nav-icon cart-icon" id="cart-icon" aria-label="Keranjang">

                <i class="fa-solid fa-cart-shopping"></i>

                <span class="cart-count" id="cart-count">0</span>

            </a>

        </div>

        <nav class="mobile-menu">

            <a href="home.html" class="mobile-nav-item active">

                <svg viewBox="0 0 24 24">
                    <path d="M3 11L12 4L21 11"></path>
                    <path d="M5 10V20H19V10"></path>
                    <path d="M9 20V14H15V20"></path>
                </svg>

                <span>Home</span>

            </a>


            <a href="#" class="mobile-nav-item">

                <svg viewBox="0 0 24 24">
                    <path d="M4 7H20"></path>
                    <path d="M6 7V20H18V7"></path>
                    <path d="M9 7C9 4.8 10.3 3 12 3C13.7 3 15 4.8 15 7"></path>
                </svg>

                <span>Produk</span>

            </a>


            <a href="#" class="mobile-nav-item">

                <svg viewBox="0 0 24 24">
                    <path d="M20 12L12 20L4 12L12 4L20 12Z"></path>
                    <circle cx="9" cy="9" r="1"></circle>
                    <path d="M10 14L14 10"></path>
                </svg>

                <span>Promo</span>

            </a>


            <a href="#" class="mobile-nav-item">

                <svg viewBox="0 0 24 24">
                    <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                    <path d="M8 8H16"></path>
                    <path d="M8 12H16"></path>
                    <path d="M8 16H13"></path>
                </svg>

                <span>Blog</span>

            </a>


            <a href="keranjang.html" class="mobile-nav-item" id="mobile-cart-icon">

                <svg viewBox="0 0 24 24">
                    <path d="M3 4H5L7.2 15.5C7.4 16.4 8.2 17 9.1 17H18"></path>
                    <path d="M7 8H21L19 14H8"></path>
                    <circle cx="10" cy="20" r="1.5"></circle>
                    <circle cx="18" cy="20" r="1.5"></circle>
                </svg>

                <span>Keranjang</span>

                <span class="cart-count mobile-cart-count" id="mobile-cart-count">
                    0
                </span>

            </a>

        </nav>

    </header>

    <main class="checkout-page">


        <!-- STEP -->

        <div class="checkout-steps">

            <div class="step active">

                <span>1</span>

                <small>Alamat</small>

            </div>


            <div class="step-line"></div>


            <div class="step">

                <span>2</span>

                <small>Pengiriman</small>

            </div>


            <div class="step-line"></div>


            <div class="step">

                <span>3</span>

                <small>Pembayaran</small>

            </div>


            <div class="step-line"></div>


            <div class="step">

                <span>4</span>

                <small>Konfirmasi</small>

            </div>

        </div>



        <!-- ALAMAT -->

        <section class="checkout-card">

            <h2>
                Alamat Pengiriman
            </h2>


            <div class="address-box">

                <div class="address-radio active">
                    <i class="fa-solid fa-circle"></i>
                </div>


                <div class="address-content">

                    <strong>
                        Oktavia Ramadani
                    </strong>

                    <p>
                        Jl. Melati No. 12, Jakarta Selatan
                    </p>

                    <p>
                        0812-3456-7890
                    </p>

                </div>



                <button class="edit-address" onclick="openAddressModal()">
                    Ubah
                </button>

                <div class="address-modal" id="addressModal">

                    <div class="address-modal-content">

                        <div class="modal-header">

                            <h3>Ubah Alamat Pengiriman</h3>

                            <button class="close-modal" onclick="closeAddressModal()">
                                &times;
                            </button>

                        </div>


                        <div class="form-group">

                            <label>Nama Penerima</label>

                            <input type="text" id="addressName" value="Oktavia Ramadani" placeholder="Masukkan nama">

                        </div>


                        <div class="form-group">

                            <label>Alamat Lengkap</label>

                            <textarea id="addressDetail" rows="3"
                                placeholder="Masukkan alamat lengkap">Jl. Melati No. 12, Jakarta Selatan</textarea>

                        </div>


                        <div class="form-group">

                            <label>Nomor Handphone</label>

                            <input type="text" id="addressPhone" value="0812-3456-7890"
                                placeholder="Masukkan nomor handphone">

                        </div>


                        <button class="save-address" onclick="saveAddress()">

                            Simpan Alamat

                        </button>

                    </div>

                </div>

            </div>

        </section>

        <section class="checkout-card">

            <h2>
                Metode Pengiriman
            </h2>


            <label class="shipping-option">

                <input type="radio" name="shipping" value="15000" checked>

                <div>
                    <strong>
                        JNE
                    </strong>

                    <small>
                        2-3 hari
                    </small>
                </div>

                <span>
                    Rp 15.000
                </span>

            </label>


            <label class="shipping-option">

                <input type="radio" name="shipping" value="14000">

                <div>
                    <strong>
                        J&T
                    </strong>

                    <small>
                        2-3 hari
                    </small>
                </div>

                <span>
                    Rp 14.000
                </span>

            </label>


            <label class="shipping-option">

                <input type="radio" name="shipping" value="16000">

                <div>
                    <strong>
                        SiCepat
                    </strong>

                    <small>
                        1-2 hari
                    </small>
                </div>

                <span>
                    Rp 16.000
                </span>

            </label>


            <button class="next-button" onclick="continuePayment()">

                Lanjut ke Pembayaran
                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </section>

    </main>


    <script src="../js/checkout.js"></script>
    <script src="../js/wishlist.js"></script>

</body>

</html>
