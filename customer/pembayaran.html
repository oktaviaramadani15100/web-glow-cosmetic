<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pembayaran - Glow.Cosmetic</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pembayaran.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

</head>

<body>


    <header class="navbar">
        <a href="home.html" class="logo">
            <img src="../img/logo.jpeg" alt="Glow.Cosmetic">
        </a>

        <nav class="desktop-menu">

            <a href="home.html">
                Home
            </a>

            <a href="produk.html">
                Produk
            </a>

            <a href="blog.html">
                Blog
            </a>
            
            <a href="faq.html">
                FAQ
            </a>

        </nav>

        <div class="desktop-actions">
            <a href="akun.html#wishlist" class="nav-icon wishlist-nav-icon" aria-label="Wishlist">
                <i class="fa-regular fa-heart"></i>
                <span class="wishlist-count" id="wishlist-count">0</span>
            </a>

            <!-- Account -->
            <a href="login.html" class="nav-icon" aria-label="Akun">
                <i class="fa-regular fa-user"></i>
            </a>

            <!-- Cart -->
            <a href="keranjang.html" class="nav-icon cart-icon" id="cart-icon" aria-label="Keranjang">

                <i class="fa-solid fa-cart-shopping"></i>

                <span class="cart-count" id="cart-count">0</span>

            </a>

        </div>

        <nav class="mobile-menu">

            <a href="home.html" class="mobile-nav-item active">

                <svg viewBox="0 0 24 24">
                    <path d="M3 11L12 4L21 11"></path>
                    <path d="M5 10V20H19V10"></path>
                    <path d="M9 20V14H15V20"></path>
                </svg>

                <span>Home</span>

            </a>


            <a href="#" class="mobile-nav-item">

                <svg viewBox="0 0 24 24">
                    <path d="M4 7H20"></path>
                    <path d="M6 7V20H18V7"></path>
                    <path d="M9 7C9 4.8 10.3 3 12 3C13.7 3 15 4.8 15 7"></path>
                </svg>

                <span>Produk</span>

            </a>


            <a href="#" class="mobile-nav-item">

                <svg viewBox="0 0 24 24">
                    <path d="M20 12L12 20L4 12L12 4L20 12Z"></path>
                    <circle cx="9" cy="9" r="1"></circle>
                    <path d="M10 14L14 10"></path>
                </svg>

                <span>Promo</span>

            </a>


            <a href="#" class="mobile-nav-item">

                <svg viewBox="0 0 24 24">
                    <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                    <path d="M8 8H16"></path>
                    <path d="M8 12H16"></path>
                    <path d="M8 16H13"></path>
                </svg>

                <span>Blog</span>

            </a>


            <a href="keranjang.html" class="mobile-nav-item" id="mobile-cart-icon">

                <svg viewBox="0 0 24 24">
                    <path d="M3 4H5L7.2 15.5C7.4 16.4 8.2 17 9.1 17H18"></path>
                    <path d="M7 8H21L19 14H8"></path>
                    <circle cx="10" cy="20" r="1.5"></circle>
                    <circle cx="18" cy="20" r="1.5"></circle>
                </svg>

                <span>Keranjang</span>

                <span class="cart-count mobile-cart-count" id="mobile-cart-count">
                    0
                </span>

            </a>

        </nav>

    </header>


    <main class="payment-page">


        <!-- STEP -->

        <div class="checkout-steps">

            <div class="step done">

                <span>
                    <i class="fa-solid fa-check"></i>
                </span>

                <small>Alamat</small>

            </div>


            <div class="step-line active"></div>


            <div class="step done">

                <span>
                    <i class="fa-solid fa-check"></i>
                </span>

                <small>Pengiriman</small>

            </div>


            <div class="step-line active"></div>


            <div class="step active">

                <span>3</span>

                <small>Pembayaran</small>

            </div>


            <div class="step-line"></div>


            <div class="step">

                <span>4</span>

                <small>Konfirmasi</small>

            </div>

        </div>



        <!-- PAYMENT -->

        <section class="payment-card">

            <h2>
                Metode Pembayaran
            </h2>


            <!-- TRANSFER BANK -->

            <label class="payment-option">

                <input type="radio" name="payment" value="bank">

                <div class="payment-icon">
                    <i class="fa-solid fa-building-columns"></i>
                </div>

                <div class="payment-info">

                    <strong>
                        Transfer Bank
                    </strong>

                    <small>
                        BCA, BNI, BRI, Mandiri
                    </small>

                </div>

            </label>


            <!-- E-WALLET -->

            <label class="payment-option">

                <input type="radio" name="payment" value="ewallet">

                <div class="payment-icon">
                    <i class="fa-solid fa-wallet"></i>
                </div>

                <div class="payment-info">

                    <strong>
                        E-Wallet
                    </strong>

                    <small>
                        OVO, GoPay, DANA, ShopeePay
                    </small>

                </div>

            </label>


            <!-- KARTU -->

            <label class="payment-option">

                <input type="radio" name="payment" value="card">

                <div class="payment-icon">
                    <i class="fa-solid fa-credit-card"></i>
                </div>

                <div class="payment-info">

                    <strong>
                        Kartu Kredit / Debit
                    </strong>

                    <small>
                        Visa, Mastercard
                    </small>

                </div>

            </label>


            <!-- COD -->

            <label class="payment-option">

                <input type="radio" name="payment" value="cod">

                <div class="payment-icon">
                    <i class="fa-solid fa-money-bill-wave"></i>
                </div>

                <div class="payment-info">

                    <strong>
                        COD (Bayar di Tempat)
                    </strong>

                    <small>
                        Tersedia untuk area tertentu
                    </small>

                </div>

            </label>


            <!-- QRIS -->

            <label class="payment-option">

                <input type="radio" name="payment" value="qris">

                <div class="payment-icon">
                    <i class="fa-solid fa-qrcode"></i>
                </div>

                <div class="payment-info">

                    <strong>
                        QRIS
                    </strong>

                    <small>
                        Scan QRIS dengan aplikasi pembayaran
                    </small>

                </div>

            </label>


            <hr>


            <div class="payment-total">

                <span>
                    Total Pembayaran
                </span>

                <strong id="payment-total">
                    Rp 0
                </strong>

            </div>


            <button class="pay-button" onclick="processPayment()">

                Bayar Sekarang
                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </section>
    </main>

    <!-- POPUP PEMBAYARAN -->

    <div class="payment-modal" id="paymentModal">

        <div class="payment-modal-content">

            <button class="close-payment" onclick="closePaymentModal()">

                &times;

            </button>


            <!-- ISI POPUP AKAN DIBUAT JAVASCRIPT -->

            <div id="payment-detail">

            </div>

        </div>

    </div>


    <script src="../js/pembayaran.js"></script>
    <script src="../js/wishlist.js"></script>

</body>

</html>
