<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manajemen User - Glow.Cosmetic</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../css/admin-pages.css">

</head>

<body>

    <div class="admin-layout">

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-logo">
                <img src="../img/logo2.png">
            </div>

            <nav class="sidebar-menu">

                <a href="dashboard.html" class="menu-item">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>Dashboard</span>
                </a>

                <a href="produk.html" class="menu-item">
                    <i class="fa-solid fa-box"></i>
                    <span>Produk</span>
                </a>

                <a href="kategori.html" class="menu-item">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Kategori</span>
                </a>

                <a href="stok.html" class="menu-item">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <span>Stok</span>
                </a>

                <a href="pesanan.html" class="menu-item">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Pesanan</span>
                </a>

                <a href="pembayaran.html" class="menu-item">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Pembayaran</span>
                </a>

                <a href="pengiriman.html" class="menu-item">
                    <i class="fa-solid fa-truck"></i>
                    <span>Pengiriman</span>
                </a>

                <a href="user.html" class="menu-item active">

                    <i class="fas fa-users"></i>

                    <span>
                        Users
                    </span>
                </a>

                <a href="laporan.html" class="menu-item">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Laporan</span>
                </a>

            </nav>

            <div class="sidebar-bottom">

                <a href="profile.html" class="admin-profile">

                    <div class="admin-avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div class="admin-profile-info">
                        <strong>Admin</strong>
                        <span>Administrator</span>
                    </div>

                </a>

            </div>

        </aside>


        <main class="main-content">

            <header class="top-header">

                <div class="header-left">

                    <button class="mobile-menu-btn" id="menuButton">
                        <i class="fa-solid fa-bars"></i>
                    </button>

                    <div>

                        <span class="breadcrumb">
                            Manajemen
                        </span>

                        <h1>User</h1>

                    </div>

                </div>

                <div class="header-right">

                    <span class="date">
                        <i class="fa-regular fa-calendar"></i>
                        Selasa, 23 Sep 2026
                    </span>

                    <div class="header-avatar">A</div>

                </div>

            </header>


            <div class="page-content">

                <div class="management-card">

                    <div class="page-toolbar">

                        <div class="search-box">

                            <i class="fa-solid fa-magnifying-glass"></i>

                            <input type="text" placeholder="Cari user...">

                        </div>


                        <button class="btn btn-primary" onclick="openModal('userModal')">

                            <i class="fa-solid fa-plus"></i>

                            Tambah User

                        </button>

                    </div>


                    <div class="table-wrapper">

                        <table class="admin-table">

                            <thead>

                                <tr>

                                    <th>NAMA</th>
                                    <th>USERNAME</th>
                                    <th>ROLE</th>
                                    <th>STATUS</th>
                                    <th>AKSI</th>

                                </tr>

                            </thead>

                            <tbody>

                                <tr>

                                    <td>Oktavia Ramadani</td>

                                    <td>admin</td>

                                    <td>Admin</td>

                                    <td>
                                        <span class="status active">
                                            Aktif
                                        </span>
                                    </td>

                                    <td>

                                        <div class="action-buttons">

                                            <button class="action-btn action-edit">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>

                                            <button class="action-btn action-delete">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>

                                        </div>

                                    </td>

                                </tr>


                                <tr>

                                    <td>Rina Putri</td>

                                    <td>rina</td>

                                    <td>User</td>

                                    <td>
                                        <span class="status active">
                                            Aktif
                                        </span>
                                    </td>

                                    <td>

                                        <div class="action-buttons">

                                            <button class="action-btn action-edit">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>

                                            <button class="action-btn action-delete">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>

                                        </div>

                                    </td>

                                </tr>


                                <tr>

                                    <td>Siti Ayu</td>

                                    <td>siti</td>

                                    <td>User</td>

                                    <td>
                                        <span class="status active">
                                            Aktif
                                        </span>
                                    </td>

                                    <td>

                                        <div class="action-buttons">

                                            <button class="action-btn action-edit">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>

                                            <button class="action-btn action-delete">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>

                                        </div>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </main>

    </div>


    <!-- MODAL TAMBAH USER -->

    <div class="modal" id="userModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Tambah User
                </h2>

                <button class="modal-close" onclick="closeModal('userModal')">

                    &times;

                </button>

            </div>


            <div class="form-group">

                <label>
                    Nama Lengkap
                </label>

                <input type="text" id="userName" placeholder="Masukkan nama lengkap">

            </div>


            <div class="form-group">

                <label>
                    Username
                </label>

                <input type="text" id="username" placeholder="Masukkan username">

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input type="password" placeholder="Masukkan password">

            </div>


            <div class="form-group">

                <label>
                    Role
                </label>

                <select id="userRole">

                    <option value="">
                        Pilih role
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                    <option value="user">
                        User
                    </option>

                </select>

            </div>


            <div class="modal-footer">

                <button class="btn btn-outline" onclick="closeModal('userModal')">

                    Batal

                </button>

                <button class="btn btn-primary" onclick="saveUser()">

                    <i class="fa-solid fa-check"></i>

                    Simpan User

                </button>

            </div>

        </div>

    </div>


    <script src="../js/admin-pages.js"></script>

</body>

</html>
